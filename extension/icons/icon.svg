<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="node" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e0e7ff"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#312e81" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- rounded app background -->
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>

  <!-- browser window -->
  <g filter="url(#soft)">
    <rect x="26" y="30" width="76" height="60" rx="10" fill="#ffffff" opacity="0.14"/>
    <rect x="26" y="30" width="76" height="60" rx="10" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <!-- title bar -->
    <line x1="26" y1="46" x2="102" y2="46" stroke="#ffffff" stroke-width="3" opacity="0.9"/>
    <circle cx="36" cy="38" r="2.6" fill="#ffffff" opacity="0.9"/>
    <circle cx="45" cy="38" r="2.6" fill="#ffffff" opacity="0.7"/>
    <circle cx="54" cy="38" r="2.6" fill="#ffffff" opacity="0.55"/>
  </g>

  <!-- link chain: node — line — node inside the viewport -->
  <g stroke="url(#node)" stroke-width="5" stroke-linecap="round">
    <line x1="52" y1="68" x2="76" y2="68"/>
  </g>
  <circle cx="48" cy="68" r="9" fill="url(#node)"/>
  <circle cx="48" cy="68" r="3.5" fill="#6366f1"/>
  <circle cx="80" cy="68" r="9" fill="url(#node)"/>
  <circle cx="80" cy="68" r="3.5" fill="#8b5cf6"/>
</svg>
